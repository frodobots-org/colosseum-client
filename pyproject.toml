[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "colosseum-client"
version = "0.1.0"
description = "Robot client transport for Colosseum policy inference"
requires-python = ">=3.10"
dependencies = [
  "async-timeout>=4,<6; python_version < '3.11'",
  "numpy>=1.26",
  "httpx>=0.27,<1",
  "Pillow>=10,<12",
  "protobuf>=6.33.5,<7",
  "PyYAML>=6,<7",
  "websockets>=15,<16",
  "pyarrow>=18,<26",
]

[project.optional-dependencies]
franka = ["droid"]
# LeRobot supplies the Feetech bus, calibration and camera drivers; it requires Python 3.12+.
so101 = ["lerobot[feetech,intelrealsense]>=0.6,<0.7; python_version >= '3.12'"]
so101-eef = ["lerobot[feetech,intelrealsense,placo-dep]>=0.6,<0.7; python_version >= '3.12'"]
yam = ["pyrealsense2>=2.55,<3"]  # Install the pinned I2RT SDK separately; see docs/yam.md.
modelscope = ["modelscope-hub>=0.4.5,<0.5"]
# Agora RTC/RTM client for the Earth Rover Mini+ link; Linux x86_64 for real runs, macOS 13+ for development.
earth-rover = ["playwright==1.60.0", "agora-python-server-sdk==2.4.9"]
huggingface = ["huggingface-hub>=1.0,<2"]
gui = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "anthropic>=1.15,<2"]  # scripts/eval_gui.py
dev = ["grpcio-tools>=1.66", "pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
colosseum-client-demo = "colosseum_client.cli:main"
colosseum-robot = "colosseum_client.robot_cli:main"
colosseum-upload-dataset = "colosseum_client.dataset_upload:main"
colosseum-rover-ui = "colosseum_client.rover_ui:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv]
# DROID pins protobuf 3.20.1; keep the Client's generated protocol on protobuf 6.
# Runtime compatibility with DROID still needs hardware validation.
override-dependencies = ["protobuf>=6.33.5,<7"]

[tool.uv.sources]
droid = { git = "https://github.com/droid-dataset/droid.git", rev = "33ae6a67274f36d2e29525b86f23a56616ef43a7" }

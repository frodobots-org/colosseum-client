[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "colosseum-client"
version = "0.1.0"
description = "Robot client transport for Colosseum policy inference"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "httpx>=0.27,<1",
  "Pillow>=10,<12",
  "protobuf>=6.33.5,<7",
  "PyYAML>=6,<7",
  "websockets>=15,<16",
]

[project.optional-dependencies]
dev = ["grpcio-tools>=1.66", "pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
colosseum-client-demo = "colosseum_client.cli:main"
colosseum-robot = "colosseum_client.robot_cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
